name: Refresh Bongnudo VOD snapshot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bongnudo-vod-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Validate refresh configuration
        shell: bash
        env:
          VOD_REFRESH_URL: ${{ secrets.VOD_REFRESH_URL }}
          VOD_REFRESH_SECRET: ${{ secrets.VOD_REFRESH_SECRET }}
        run: |
          if [ -z "$VOD_REFRESH_URL" ]; then
            echo "::error::VOD_REFRESH_URL is not configured"
            exit 1
          fi

          if [ -z "$VOD_REFRESH_SECRET" ]; then
            echo "::error::VOD_REFRESH_SECRET is not configured"
            exit 1
          fi

          case "$VOD_REFRESH_URL" in
            https://*)
              ;;
            *)
              echo "::error::VOD_REFRESH_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Read refresh plan and update batches
        shell: bash
        env:
          VOD_REFRESH_URL: ${{ secrets.VOD_REFRESH_URL }}
          VOD_REFRESH_SECRET: ${{ secrets.VOD_REFRESH_SECRET }}
        run: |
          REFRESH_URL="${VOD_REFRESH_URL%/}"
          PLAN_URL="${REFRESH_URL%/refresh}/refresh-plan"

          echo "Reading VOD refresh plan..."

          if ! PLAN=$(curl --fail-with-body \
            --silent \
            --show-error \
            --request GET \
            --header "Authorization: Bearer ${VOD_REFRESH_SECRET}" \
            "${PLAN_URL}"); then
            echo "::error::Failed to read VOD refresh plan"
            echo "${PLAN}"
            exit 1
          fi

          if ! BATCH_COUNT=$(jq --exit-status --raw-output \
            '.batchCount | select(type == "number" and . >= 0 and floor == .)' \
            <<<"${PLAN}"); then
            echo "::error::Invalid VOD refresh plan"
            echo "${PLAN}"
            exit 1
          fi

          echo "VOD refresh plan: ${BATCH_COUNT} batches"

          for ((batch=0; batch<BATCH_COUNT; batch++)); do
            echo "Refreshing VOD batch ${batch}/${BATCH_COUNT}"

            if ! RESPONSE=$(curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer ${VOD_REFRESH_SECRET}" \
              "${REFRESH_URL}?batch=${batch}"); then
              echo "::error::VOD batch ${batch} failed"
              echo "${RESPONSE}"
              exit 1
            fi

            echo "Batch ${batch} completed: ${RESPONSE}"
          done

          echo "VOD refresh completed"
